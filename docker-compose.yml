version: "3.8"

services:
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=cinema
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      # - .:/app
      - static_data:/app/static
      - media_data:/app/media
    environment:
      - DB_HOST=db
      - DB_NAME=cinema
      - DB_USER=postgres
      - DB_PASS=postgres
      - SECRET_KEY=django-insecure-key-repalce-me
    depends_on:
      - db
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  static_data:
  media_data:
